{% extends "index.html" %}

{% block title %}Minhas Postagens{% endblock %}

{% block content %}
<main class="py-5 px-3 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="editor-card p-4 p-sm-5">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4 pb-3 border-bottom border-subtle">
            <div class="d-flex align-items-center gap-3">
                <div class="feature-icon mb-0">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h1 class="h3 fw-bold text-white mb-0">Escrever Postagem</h1>
                    <p class="small text-secondary-custom mb-0">Compartilhe uma ideia, dúvida ou discussão com a comunidade</p>
                </div>
            </div>
            <a href="/feed" class="btn btn-ghost btn-sm px-3 py-2 d-inline-flex align-items-center gap-2">
                <i class="bi bi-arrow-left"></i>
                <span>Voltar ao Feed</span>
            </a>
        </div>

        {% for error in errors %}
            <div class="alert alert-danger auth-alert d-flex align-items-center gap-2 rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <div class="small">{{ error }}</div>
            </div>
        {% endfor %}

        <form method="POST" action="/postagem">
            <div class="mb-4">
                <label for="titulo" class="form-label small fw-medium text-light">Título</label>
                <div class="input-group auth-input-group">
                    <span class="input-group-text">
                        <i class="bi bi-type-h1"></i>
                    </span>
                    <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ex.: Como estruturar projetos Flask escaláveis?" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="conteudo" class="form-label small fw-medium text-light">Conteúdo</label>
                <div class="auth-input-group p-1">
                    <textarea class="form-control textarea-dark" id="conteudo" name="conteudo" rows="7" placeholder="Escreva os detalhes da sua publicação aqui..." required></textarea>
                </div>
            </div>

            <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 pt-2">
                <a href="/minhas-postagens" class="btn btn-outline-glass px-4 py-2 d-inline-flex align-items-center justify-content-center">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary-glow px-4 py-2 d-inline-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-send-fill"></i>
                    <span>Publicar</span>
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
