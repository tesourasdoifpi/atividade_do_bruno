{% extends "index.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<main class="auth-section d-flex align-items-center justify-content-center flex-grow-1 py-5 px-3">
    <div class="auth-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="auth-icon-badge mx-auto mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1 class="h3 fw-bold text-white mb-1">Cadastro de Usuário</h1>
            <p class="small text-secondary-custom mb-0">Crie sua conta para participar das discussões</p>
        </div>

        {% for error in errors %}
            <div class="alert alert-danger auth-alert d-flex align-items-center gap-2 rounded-3 mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <div class="small">{{ error }}</div>
            </div>
        {% endfor %}

        <form method="POST" action="/cadastro">
            <div class="mb-3">
                <label for="username" class="form-label small fw-medium text-light">Nome de usuário</label>
                <div class="input-group auth-input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Escolha seu usuário" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label small fw-medium text-light">Senha</label>
                <div class="input-group auth-input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha segura" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-glow w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                <span>Cadastrar</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-subtle">
            <p class="small text-secondary-custom mb-0">
                Já possui uma conta?
                <a href="/login" class="link-accent fw-semibold ms-1">Entrar</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}
